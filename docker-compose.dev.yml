services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: dashboard
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  pgdata:
